<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExoSounds</title>
  
  <!-- SEO & Social Sharing Meta Tags -->
  <meta name="description" content="ExoSounds - Links oficiais, músicas, lançamentos e redes sociais.">
  <meta property="og:title" content="ExoSounds">
  <meta property="og:description" content="ExoSounds - Links oficiais, músicas, lançamentos e redes sociais.">
  <meta property="og:image" content="assets/images/background.jpg">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Atmospheric background layers -->
  <div class="background-overlay" aria-hidden="true"></div>

  <!-- Main Single-Column Card -->
  <main class="page-container">
    <header class="profile-header">
      <div class="logo-wrapper">
        <img src="assets/images/logo.png" alt="ExoSounds Logo" class="profile-logo">
      </div>
      <h1 class="profile-title">ExoSounds</h1>
    </header>

    <section class="links-section" aria-label="Links e Músicas">
      <!-- Social Media Section -->
      <div class="links-group">
        <a href="https://www.instagram.com/exosoundsoficial" target="_blank" rel="noopener noreferrer" class="link-card">
          <span class="link-icon-box">
            <img src="assets/icons/instagram.svg" alt="" class="link-icon">
          </span>
          <span class="link-label">Instagram</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <a href="https://www.youtube.com/@ExoSoundsOficial" target="_blank" rel="noopener noreferrer" class="link-card">
          <span class="link-icon-box">
            <img src="assets/icons/youtube.svg" alt="" class="link-icon">
          </span>
          <span class="link-label">YouTube</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <a href="https://www.tiktok.com/@exosoundsoficial" target="_blank" rel="noopener noreferrer" class="link-card">
          <span class="link-icon-box">
            <img src="assets/icons/tiktok.svg" alt="" class="link-icon">
          </span>
          <span class="link-label">TikTok</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <!-- Spotify Player Embed -->
      <div class="player-wrapper">
        <iframe 
          title="Spotify Artist Player"
          src="https://open.spotify.com/embed/artist/1GizaL0nConxVRKntIWXJP?utm_source=generator&theme=0" 
          width="100%" 
          height="152" 
          frameBorder="0" 
          allowfullscreen="" 
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
          loading="lazy">
        </iframe>
      </div>

      <!-- Streaming Platforms -->
      <div class="links-group">
        <a href="https://music.apple.com/us/artist/exosounds/1838875194" target="_blank" rel="noopener noreferrer" class="link-card">
          <span class="link-icon-box">
            <img src="assets/icons/apple-music.png" alt="" class="link-icon">
          </span>
          <span class="link-label">Apple Music</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <a href="https://link.deezer.com/s/31b8oBJhUGfDVV4rnaLym" target="_blank" rel="noopener noreferrer" class="link-card">
          <span class="link-icon-box">
            <img src="assets/icons/deezer.png" alt="" class="link-icon">
          </span>
          <span class="link-label">Deezer</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <a href="https://music.youtube.com/channel/UCouxW577-jg_Q6Z68EfF85w?si=wC5VVrHTWoAtZKqI" target="_blank" rel="noopener noreferrer" class="link-card">
          <span class="link-icon-box">
            <img src="assets/icons/youtube-music.png" alt="" class="link-icon">
          </span>
          <span class="link-label">YouTube Music</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <a href="https://tidal.com/artist/66707619/u" target="_blank" rel="noopener noreferrer" class="link-card">
          <span class="link-icon-box">
            <img src="assets/icons/tidal.svg" alt="" class="link-icon">
          </span>
          <span class="link-label">Tidal</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>

      <!-- Hotmart Course / Community -->
      <div class="links-group">
        <a href="https://hotmart.com/pt-br/club/exosounds/exosounds-planeta-azul/E102208270S" target="_blank" rel="noopener noreferrer" class="link-card featured">
          <span class="link-icon-box">
            <img src="assets/icons/hotmart.png" alt="" class="link-icon">
          </span>
          <span class="link-label">ExoSounds - Planeta Azul</span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <footer class="page-footer">
      <p>&copy; ExoSounds. Todos os direitos reservados.</p>
    </footer>
  </main>
</body>
</html>
